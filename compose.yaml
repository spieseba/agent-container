# Shared configuration
x-base-service: &base-service
  image: localhost/agent-container
  build:
    context: .
    dockerfile: Containerfile
    args:
      TZ: Europe/Berlin
      # CLI build args. 
      # Claude Code, Mistral Vibe, Codex, and Antigravity are on by default 
      # Set an argument to "false" to disable its CLI. Rebuild after changing.
      INSTALL_CLAUDE: "true"
      INSTALL_VIBE: "true"
      INSTALL_CODEX: "true"
      INSTALL_ANTIGRAVITY: "true"
      # Set to "false" to use default agent settings. Rebuild after changing.
      INSTALL_AGENT_CONFIG: "true"
      # Uncomment and change the URL to use your own config repository.
      # AGENT_CONFIG_REPO: "https://github.com/spieseba/agent-config.git"
  # Private workspace: run only one service against it at a time.
  volumes:
    - ./workspace:/home/agent/workspace:rw,Z
  stdin_open: true
  tty: true
  command: bash

services:
  # CPU-only 
  agent:
    <<: *base-service
    container_name: agent
    userns_mode: "keep-id:uid=1000,gid=1000"
    # Interactive Bash ignores SIGTERM; SIGHUP requests shell shutdown.
    stop_signal: SIGHUP
  # Fedora NVIDIA GPU via CDI.
  agent-gpu:
    <<: *base-service
    container_name: agent-gpu
    userns_mode: "keep-id:uid=1000,gid=1000"
    stop_signal: SIGHUP
    # Requires container_use_xserver_devices on the Fedora host.
    profiles: [gpu]
    devices:
      - nvidia.com/gpu=all
